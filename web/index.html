<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPL AI Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1>FPL AI Manager</h1>
        <div id="manager-line" class="muted"></div>
      </div>
      <div id="season" class="muted"></div>
    </div>
  </header>

  <main class="container">
    <p id="load-status" class="muted">正在读取最新 FPL 数据……</p>

    <section id="overview" class="cards-grid"></section>

    <section class="panel">
      <h2>本轮建议</h2>
      <p class="muted disclaimer">这是 AI 建议，不会自动提交到 FPL。</p>
      <div id="transfer-advice"></div>
    </section>

    <section class="panel">
      <h2>首发建议（AI 全局最优）</h2>
      <div id="formation-line" class="muted"></div>
      <div id="engine-meta" class="muted engine-meta"></div>
      <div id="team-xi" class="pitch"></div>
      <div class="bench-title">替补栏：第 1 位恒为门将，其余按决策优先级</div>
      <div id="team-bench" class="player-grid"></div>
    </section>

    <section class="panel">
      <h2>历史记录</h2>
      <div id="history-table"></div>
    </section>

    <section id="external-links" class="panel">
      <h2>External Links</h2>
      <div id="external-links-row" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;">
        <a href="#" title="小红书" style="display:inline-flex;align-items:center;"><img src="img/小红书icon.png" alt="小红书" style="height:32px;width:32px;object-fit:contain;"></a>
        <a href="#" title="B站" style="display:inline-flex;align-items:center;"><img src="img/bilibili.png" alt="B站" style="height:32px;width:32px;object-fit:contain;"></a>
        <a href="#" title="懂球帝" style="display:inline-flex;align-items:center;"><img src="img/dqd.png" alt="懂球帝" style="height:32px;width:32px;object-fit:contain;"></a>
        <a href="#" title="微信" style="display:inline-flex;align-items:center;"><img src="img/wechat-logo.png" alt="微信" style="height:32px;width:32px;object-fit:contain;"></a>
        <span style="font-weight:600;color:var(--muted);">FPL紫葱酱</span>
      </div>
    </section>
  </main>

  <footer class="container muted">
    <span id="last-update"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
