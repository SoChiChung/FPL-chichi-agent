<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPL AI Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1>FPL AI Manager</h1>
        <div id="manager-line" class="muted"></div>
      </div>
      <div id="season" class="muted"></div>
    </div>
  </header>

  <!-- 移动端摘要条（≤768px 显示）：与 Sidebar 同一数据源、同一渲染函数 -->
  <div id="mobile-summary" class="mobile-summary container">
    <div class="m-head">
      <span class="avatar" aria-hidden="true">🧅</span>
      <div class="m-title">
        <div class="m-name" id="m-name"></div>
        <div id="m-sub" class="muted"></div>
      </div>
    </div>
    <div id="m-stats" class="m-stats"></div>
  </div>

  <div class="container dashboard">
    <div class="layout-grid">

      <!-- Sidebar（25%）：桌面常驻，≤768px 隐藏 -->
      <aside class="sidebar">
        <section class="panel">
          <h2>AI Manager Profile</h2>
          <div class="profile-head">
            <span class="avatar avatar-lg" aria-hidden="true">🧅</span>
            <div class="profile-title">
              <div class="profile-name" id="profile-name"></div>
              <div id="profile-season" class="muted"></div>
            </div>
          </div>
          <dl class="profile-list">
            <div class="pl-row"><dt>Manager Style</dt><dd id="p-style"></dd></div>
            <div class="pl-row"><dt>Risk Level</dt><dd id="p-risk"></dd></div>
            <div class="pl-row"><dt>阵型偏好</dt><dd id="p-formation"></dd></div>
          </dl>
        </section>

        <section class="panel">
          <h2>当前战绩</h2>
          <div id="records" class="records"></div>
        </section>

        <section class="panel">
          <h2>最近一次思考</h2>
          <div id="recent-thought" class="recent-thought"></div>
        </section>

        <!-- External Links：桌面挂载点（移动端收进页脚） -->
        <div id="external-links-desktop" class="ext-mount panel"></div>
      </aside>

      <!-- Main（75%）：① → ⑥ -->
      <main class="main">
        <p id="load-status" class="muted">正在读取最新 FPL 数据……</p>

        <!-- ① 本轮成绩摘要卡 -->
        <section id="summary-cards" class="cards-grid" aria-label="本轮成绩"></section>

        <!-- ② AI 本周动态 -->
        <section class="panel" id="sec-thisweek">
          <h2>AI 本周动态</h2>
          <div id="this-week"></div>
        </section>

        <!-- ③ 本轮阵容（支持 当前 / 转会后 双视图） -->
        <section class="panel">
          <h2>本轮阵容</h2>
          <div class="squad-bar">
            <div id="formation-line" class="muted"></div>
            <div id="squad-toggle" class="seg" hidden>
              <button type="button" class="seg-btn active" data-v="cur">当前阵容</button>
              <button type="button" class="seg-btn" data-v="sug">转会后阵容</button>
            </div>
          </div>
          <div id="squad-note" class="muted squad-note"></div>
          <div id="team-xi" class="pitch"></div>
          <div class="bench-title">替补席（第 1 顺位恒为门将，其余按决策优先级）</div>
          <div id="team-bench" class="player-grid"></div>
        </section>

        <!-- ④ AI 思考日志（本轮） -->
        <section class="panel" id="sec-thoughts">
          <h2>AI 思考日志</h2>
          <div id="thoughts-gw" class="muted"></div>
          <div id="thoughts-current"></div>
        </section>

        <!-- ⑤ 历史记录（Accordion） -->
        <section class="panel">
          <h2>历史记录</h2>
          <div id="history-accordion"></div>
        </section>

        <!-- ⑥ 趋势曲线（三条，Tab 切换） -->
        <section class="panel">
          <h2>趋势曲线</h2>
          <div id="trend-tabs" class="trend-tabs" role="tablist" aria-label="趋势维度切换"></div>
          <div id="trend-box"></div>
        </section>
      </main>
    </div>
  </div>

  <footer class="container">
    <!-- External Links：移动端挂载点 -->
    <div id="external-links-footer" class="ext-mount"></div>
    <div id="last-update" class="muted"></div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
