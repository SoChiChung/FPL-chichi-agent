name: update

on:
  schedule:
    # 每 10 分钟自触发一次；是否真跑引擎由闸门 brain/scheduler.py 判定
    # （>24h: 每天北京 09:00 / 24h 内: 每小时 / 1h 内: 每 10 分钟 / 休赛期: 24h 探测）
    - cron: "*/10 * * * *"
  workflow_dispatch: # 手动触发 = 闸门强制 due，更新一次

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 闸门（只读 data/state.json，不请求 FPL）
        id: gate
        run: python3 -m brain.scheduler

      - name: 运行大脑（拉取数据，生成 state/history）
        if: steps.gate.outputs.due == 'yes'
        run: python3 -m brain

      - name: 自动提交数据更新
        if: steps.gate.outputs.due == 'yes'
        run: |
          git config user.name "FPL AI Bot"
          git config user.email "fpl-ai-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(data): 更新 FPL 快照"
            git push origin HEAD:main
          fi
