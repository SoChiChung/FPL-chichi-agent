name: update

on:
  schedule:
    # 每半小时运行引擎；另有独立每日结算回填任务。
    # （赛季中统一每 30 分钟更新，休赛期每天探测一次）
    - cron: "*/30 * * * *"
  workflow_dispatch: # 手动触发 = 闸门强制 due，更新一次

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 闸门（只读 data/state.json，不请求 FPL）
        id: gate
        run: python3 -m brain.scheduler

      - name: 运行大脑（拉取数据，生成 state/history）
        if: steps.gate.outputs.due == 'yes'
        run: python3 -m brain

      - name: 自动提交数据更新
        if: steps.gate.outputs.due == 'yes'
        run: |
          git config user.name "FPL AI Bot"
          git config user.email "fpl-ai-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(data): 更新 FPL 快照"
            git push origin HEAD:main
          fi

  settlement-backfill:
    # GitHub cron 使用 UTC：01:15 UTC = 北京时间每天 09:15
    if: github.event_name == 'schedule' && github.event.schedule == '15 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 官方历史结算回填
        run: python3 -m brain.backfill

      - name: 提交回填结果
        run: |
          git config user.name "FPL AI Bot"
          git config user.email "fpl-ai-bot@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "无历史回填变化，跳过提交"
          else
            git commit -m "chore(data): 回填 FPL 结算历史"
            git push origin HEAD:main
          fi
